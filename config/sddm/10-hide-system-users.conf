# Managed by .mico (bootstrap.sh). Edits are overwritten.
#
# The multi-user nix daemon creates nixbld1..nixbld32 build users. They exist
# only to sandbox builds, have a nologin shell, and sddm listed them all on the
# greeter next to the real account.
#
# Hiding by shell rather than by name: it needs no updating when the build-user
# count changes, and it is the correct rule in general - an account that cannot
# open a shell cannot be logged into, so it does not belong on a greeter.
[Users]
HideShells=/usr/bin/nologin,/sbin/nologin,/bin/false,/usr/bin/false
