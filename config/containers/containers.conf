# Global & user container engine configuration.
#
# In WSL2 and Linux environments without full nftables NAT/compat kernel modules,
# Netavark (Podman's network stack) fails with:
#   netavark: nftables error: "nft" did not return successfully while applying ruleset:
#   internal:0:0-0: Error: Could not process rule: No such file or directory
#
# Setting firewall_driver = "none" disables Netavark's host nftables rule generation,
# allowing container bridge networks and port forwarding via pasta to work without
# requiring missing kernel netfilter modules.
[network]
firewall_driver = "none"
