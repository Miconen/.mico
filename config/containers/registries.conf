# Rootless podman registry resolution.
#
# Arch's containers-common ships short-name aliases at
# /usr/share/containers/registries.conf.d/00-shortnames.conf, but only for a
# curated list - `golang` is in it, `adminer` and `postgres` are not. Without an
# unqualified search registry those fail outright:
#
#   short-name "postgres:latest" did not resolve to an alias and no
#   containers-registries.conf(5) was found
#
# docker.io only, deliberately. With several search registries, which image a
# bare name resolves to depends on registry ordering and on who registered the
# name first, which is a supply-chain footgun rather than a convenience.
unqualified-search-registries = ["docker.io"]

# "enforcing" prompts to disambiguate short names on a TTY and hard-fails
# without one, which breaks `podman compose` and any script. "permissive" uses
# the search list above instead of asking.
#
# Fully qualifying images in compose files and Dockerfiles is still better - it
# removes the ambiguity at the source. This only stops the tooling breaking when
# an upstream file does not.
short-name-mode = "permissive"
