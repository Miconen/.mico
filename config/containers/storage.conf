# Rootless podman storage. Home is on btrfs; the default overlay driver cannot
# sit on btrfs ("backing file system is unsupported for this graph driver").
# The btrfs graph driver uses subvolumes instead.
#
# If you previously started podman with overlay, wipe the broken store once:
#   podman system reset
# (or: rm -rf ~/.local/share/containers/storage)
[storage]
driver = "btrfs"
