# Rootless podman on btrfs home.
#
# Default driver is overlay, which cannot back onto btrfs:
#   'overlay' is not supported over btrfs ... backing file system is unsupported
# Use the btrfs graph driver (subvolumes) instead.
#
# After changing driver, any store already initialized as overlay must go.
# home-manager activation and bootstrap.sh wipe leftover overlay/ dirs.
[storage]
driver = "btrfs"
