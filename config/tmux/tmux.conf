# Managed by home-manager (see home/tools.nix). Edit it in ~/.mico, not here.

# tmux-256color is the correct terminfo for tmux; screen-256color is a holdover
# that breaks italics and some cursor shapes.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

set -g mouse on
setw -g mode-keys vi

set -g status-position top
set -g status-justify left
set -g status-right '%Y-%m-%d %H:%M '

# Catppuccin Mocha
set -g status-style "fg=#cdd6f4,bg=#1e1e2e"
set -g status-left-style "fg=#89b4fa"
setw -g window-status-current-style "fg=#1e1e2e,bg=#cba6f7,bold"
setw -g window-status-style "fg=#6c7086"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "fg=#cdd6f4,bg=#313244"
