# stylua configuration for .config/nvim.
#
# These are stylua's own defaults, written out explicitly so a future stylua
# release changing a default cannot silently reformat the whole config.
#
# Tabs because 17 of the 20 Lua files already used tabs; the three that used
# two-space indent were normalised when stylua was first introduced.
column_width = 120
line_endings = "Unix"
indent_type = "Tabs"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
