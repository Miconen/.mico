# Neovim runs LuaJIT, which is Lua 5.1 plus the `vim` global. `vim.yml` next to
# this file defines that global; selene resolves `std` names against sibling
# .yml/.toml files.
std = "vim"

[lints]
# lazy.nvim plugin specs are `{ "owner/repo", opt = value }`, which is a mixed
# table by definition.
mixed_table = "allow"

# `map("n", "<leader>x", function() thing() end, { desc = "..." })` is the standard
# way to write a Neovim keymap, and selene counts the inline function body as a
# second statement on the line. Pervasive and intentional.
multiple_statements = "allow"
