name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [arch, wsl]
    steps:
      - uses: actions/checkout@v4
        with:
          # The flake never reads .config/nvim (mkOutOfStoreSymlink).
          submodules: false

      - uses: DeterminateSystems/nix-installer-action@main

      - name: nix build ${{ matrix.host }}
        run: |
          nix build ".#homeConfigurations.${{ matrix.host }}.activationPackage" \
            --no-link --print-build-logs

  lint:
    name: lint
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: DeterminateSystems/nix-installer-action@main

      - name: lint
        run: ./ci/lint.sh
